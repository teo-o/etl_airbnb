# MongoDB local para el taller ETL Airbnb Bogotá.
# Uso: docker compose up -d   (expone mongodb://localhost:27017)
services:
  mongodb:
    image: mongo:7
    container_name: mongo_airbnb
    ports:
      - "27017:27017"
    volumes:
      - mongo_airbnb_data:/data/db
    restart: unless-stopped

volumes:
  mongo_airbnb_data:
